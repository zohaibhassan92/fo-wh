<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlameOn – WH End Count</title>
<script src="lib/jspdf.umd.min.js"></script>

<style>
:root{--bg:#f3f4f7;--card:#fff;--ink:#1a1d29;--mute:#6b7280;--line:#e2e5ea;--or:#e9262a;--navy:#111111;--row:#f8f9fb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:#e9262a;color:#fff;border-bottom:4px solid #111;padding:8px 18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.logo{width:84px;height:84px;display:block;flex:none}
header h1{margin:0;font-size:22px;font-weight:900;letter-spacing:.5px}
header small{color:#ffe1e1;display:block;margin-top:2px}
main{max-width:1100px;margin:14px auto;padding:0 12px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
label{font-weight:600;font-size:14px;display:block;margin-bottom:5px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:15px;background:#fff;color:var(--ink);font-family:inherit}
input:focus,select:focus{outline:2px solid var(--or);border-color:var(--or)}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;background:#eef0f4}
.times div span{font-size:13px;color:var(--mute);display:block}.times div b{font-size:18px}
.bar{display:flex;gap:10px;align-items:center}
.bar input{flex:1}.bar .cnt{color:var(--mute);font-size:14px;white-space:nowrap}
button{border:0;border-radius:8px;padding:11px 18px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.dark{background:var(--navy);color:#fff}.or{background:var(--or);color:#fff}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.tw{max-height:62vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse}
thead th{position:sticky;top:0;background:var(--navy);color:#fff;text-align:left;padding:11px 8px;font-size:14px;z-index:2}
td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:middle}
tr:nth-child(even) td{background:var(--row)}
td.n{width:42px;color:var(--mute);text-align:center}
td.nm{font-weight:600;min-width:170px}td.nm em{font-style:normal;font-size:11px;color:var(--or);background:#fdeaea;border-radius:4px;padding:1px 6px;margin-left:6px;white-space:nowrap}
td.num{width:120px}td.rm{min-width:200px}
.wc{font-size:11px;color:var(--mute);text-align:right}
.credit{text-align:right;font-size:13px;color:var(--mute);padding:6px 4px}.credit::before{content:"";}
.empty{padding:26px;text-align:center;color:var(--mute);display:none}
.foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px;display:flex;justify-content:space-between;gap:10px}
.foot button{min-width:120px}
#msg{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:9;max-width:92%}
@media(max-width:720px){
 .grid3,.times{grid-template-columns:1fr}.times{gap:6px}
 .bar{flex-wrap:wrap}
 thead{display:none}
 .tw{max-height:none;border:0;overflow:visible}
 table,tbody,tr,td{display:block;width:100%}
 tr{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:8px;background:#fff}
 tr:nth-child(even) td{background:transparent}
 td{border:0;padding:4px 2px}
 td.n{display:none}td.num{width:auto;display:inline-block;width:calc(50% - 4px)}
 td.num::before,td.rm::before{content:attr(data-l);display:block;font-size:12px;color:var(--mute);margin-bottom:2px}
 td.rm{min-width:0}
}
</style></head><body>

const TITLE="WH End Count";
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const fmtT=d=>{let h=d.getHours(),a=h>=12?"PM":"AM";h=h%12||12;return pad(h)+":"+pad(d.getMinutes())+" "+a};
const fmtD=s=>s.split("-").reverse().join("-");
const toast=t=>{const m=$("msg");m.textContent=t;m.style.display="block";clearTimeout(m._t);m._t=setTimeout(()=>m.style.display="none",3500)};

// ---- setup
let start=new Date();
$("st").textContent=fmtT(start);
const today=new Date();$("dt").value=today.getFullYear()+"-"+pad(today.getMonth()+1)+"-"+pad(today.getDate());
const tb=$("tb");
tb.innerHTML=ITEMS.map((it,i)=>`<tr data-i="${i}">
 <td class="n">${i+1}</td>
 <td class="nm">${it[0]}<em>${it[1]}</em></td>
 <td class="num" data-l="Pkt"><input class="pk" inputmode="decimal" placeholder="0" autocomplete="off"></td>
 <td class="num" data-l="Open PCs"><input class="op" inputmode="decimal" placeholder="0" autocomplete="off"></td>
 <td class="rm" data-l="Remarks (max 20 words)"><input class="rk" placeholder="Remarks"><div class="wc"></div></td></tr>`).join("");
const rows=[...tb.rows];

// ---- number-only inputs (10, 10.5, 0.25)
tb.addEventListener("input",e=>{
 const t=e.target;
 if(t.classList.contains("pk")||t.classList.contains("op")){
  let v=t.value.replace(/,/g,".").replace(/[^0-9.]/g,"");
  const p=v.split(".");if(p.length>2)v=p[0]+"."+p.slice(1).join("");
  t.value=v;
 }else if(t.classList.contains("rk")){
  const w=t.value.trim().split(/\s+/).filter(Boolean);
  if(w.length>20){t.value=w.slice(0,20).join(" ");}
  const n=t.value.trim()?t.value.trim().split(/\s+/).length:0;
  t.nextElementSibling.textContent=n?n+"/20 words":"";
 }
 save();
});

// ---- smart search (substring + typo tolerant + word-prefix)
const norm=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
const words=ITEMS.map(it=>norm(it[0]).split(" "));
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;
 for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return d[m][n]}
function tokOK(t,ws,full){
 if(full.includes(t))return true;
 const tol=t.length>=7?2:t.length>=4?1:0;if(!tol)return false;
 return ws.some(w=>lev(t,w.slice(0,t.length))<=tol||lev(t,w)<=tol);
}
function filter(){
 const q=norm($("q").value);let n=0;
 rows.forEach((r,i)=>{
  const ok=!q||q.split(" ").every(t=>tokOK(t,words[i],words[i].join(" ")));
  r.style.display=ok?"":"none";if(ok)n++;
 });
 $("cnt").textContent="Showing "+n+" items";$("emp").style.display=n?"none":"block";
}
$("q").addEventListener("input",filter);
$("clr").onclick=()=>{$("q").value="";filter();$("q").focus()};
filter();

// ---- draft autosave (phone refresh se data na jaye)
const KEY="flameon_wh_draft_v1";
function collect(){return rows.map(r=>({pk:r.querySelector(".pk").value,op:r.querySelector(".op").value,rk:r.querySelector(".rk").value}))}
function save(){try{localStorage.setItem(KEY,JSON.stringify({mgr:$("mgr").value,start:start.getTime(),d:collect()}))}catch(e){}}
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s){
 $("mgr").value=s.mgr||"";start=new Date(s.start);$("st").textContent=fmtT(start);
 s.d.forEach((x,i)=>{const r=rows[i];if(!r)return;r.querySelector(".pk").value=x.pk;r.querySelector(".op").value=x.op;r.querySelector(".rk").value=x.rk})}}catch(e){}
$("mgr").oninput=save;

$("rst").onclick=()=>{if(!confirm("Saara entered data clear ho jaye ga. Reset karein?"))return;
 rows.forEach(r=>r.querySelectorAll("input").forEach(i=>i.value=""));document.querySelectorAll(".wc").forEach(w=>w.textContent="");
 $("q").value="";filter();start=new Date();$("st").textContent=fmtT(start);$("et").textContent=$("tt").textContent="--:--";
 try{localStorage.removeItem(KEY)}catch(e){}};

// ---- submit
function dl(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
const csvCell=v=>'"'+String(v??"").replace(/"/g,'""')+'"';

$("sub").onclick=()=>{
 const mgr=$("mgr").value.trim(),dt=$("dt").value;
 if(!mgr||!dt){toast("Auditor name aur Date zaroori hain.");window.scrollTo({top:0,behavior:"smooth"});return}
 const data=collect();
 for(let i=0;i<data.length;i++){
  for(const k of ["pk","op"]){const v=data[i][k];if(v!==""&&(isNaN(v)||v==="."))
   {toast("Galat number: "+ITEMS[i][0]);$("q").value="";filter();rows[i].scrollIntoView({block:"center"});return}}
 }
 const filled=data.filter(d=>d.pk!==""||d.op!=="").length;
 if(filled<ITEMS.length&&!confirm(filled+" / "+ITEMS.length+" items filled hain. Phir bhi submit karein?"))return;

 const end=new Date(),sec=Math.round((end-start)/1000);
 const dur=pad(Math.floor(sec/3600))+":"+pad(Math.floor(sec%3600/60))+":"+pad(sec%60);
 $("et").textContent=fmtT(end);$("tt").textContent=dur;
 const info={role:"Auditor",mgr,date:fmtD(dt),start:fmtT(start),end:fmtT(end),dur};
 const base="FlameOn_WH_EndCount_"+dt;

 // CSV
 const lines=[["Items","UOM","Pkt","Open Pcs","Remarks"].map(csvCell).join(",")];
 ITEMS.forEach((it,i)=>lines.push([it[0],it[1],data[i].pk,data[i].op,data[i].rk].map(csvCell).join(",")));
 lines.push("");[["Auditor",info.mgr],["Date",info.date],["Start Time",info.start],["End Time",info.end],["Total Filling Time",info.dur]]
  .forEach(x=>lines.push(x.map(csvCell).join(",")));
 const csvText=lines.join("\r\n");
 const send=pdf=>{if(!ENDPOINT)return;fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({title:TITLE,info,base,csv:csvText,pdf:pdf||""})}).then(()=>toast("Email bhej di gayi.")).catch(()=>toast("Email nahi ja saki."))};
 dl(new Blob(["\ufeff"+csvText],{type:"text/csv;charset=utf-8"}),base+".csv");

 // PDF (4 columns)
 setTimeout(()=>{
  try{
   const {jsPDF}=window.jspdf,doc=new jsPDF({unit:"pt",format:"a4"});
   doc.setFillColor(233,38,42);doc.rect(0,0,595,58,"F");doc.addImage(LOGO,"PNG",0,0,58,58);
   doc.setTextColor(255,255,255);doc.setFont("helvetica","bold");   doc.setTextColor(255,255,255);doc.setFontSize(13);doc.text("FLAME ON - WH End Count",72,35);
   doc.setTextColor(30,30,30);doc.setFontSize(10);doc.setFont("helvetica","normal");
   doc.text("Auditor: "+info.mgr,36,78);doc.text("Date: "+info.date,300,78);
   doc.text("Start: "+info.start+"    End: "+info.end+"    Total Filling Time: "+info.dur,36,108);
   doc.autoTable({startY:120,head:[["Item Name","Pkt","Open PCs","Remarks"]],
    body:ITEMS.map((it,i)=>[it[0]+" ("+it[1]+")",data[i].pk,data[i].op,data[i].rk]),
    styles:{fontSize:8.5,cellPadding:3.5,overflow:"linebreak"},
    headStyles:{fillColor:[17,17,17]},alternateRowStyles:{fillColor:[246,247,250]},
    columnStyles:{0:{cellWidth:190},1:{cellWidth:60,halign:"center"},2:{cellWidth:65,halign:"center"},3:{cellWidth:"auto"}},
    margin:{left:36,right:36},
    didDrawPage:()=>{doc.setFontSize(8);doc.setTextColor(120);doc.text("Page "+doc.internal.getNumberOfPages(),559,820,{align:"right"})}});
   doc.save(base+".pdf");send(doc.output("datauristring").split(",")[1]);
   toast("Submit ho gaya. CSV aur PDF download ho gayi.");
  }catch(e){toast("PDF nahi ban saki (internet check karein). CSV download ho gayi.");send(null)}
 },700);

 try{localStorage.removeItem(KEY)}catch(e){}
};
</script></body></html>
